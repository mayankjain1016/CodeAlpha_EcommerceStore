<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog | ApexStore</title>
  <meta name="description" content="Explore ApexStore's full catalog of genuine electronics, fashion apparel, home appliances, and sports fitness gear with live filters and sorting.">
  <link rel="stylesheet" href="css/style.css?v=2.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%232874f0%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%229%22 cy=%2221%22 r=%221%22/><circle cx=%2220%22 cy=%2221%22 r=%221%22/><path d=%22M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6%22/></svg>">
</head>
<body>
  <!-- Global Header (Top Utility Bar, Main Header, Category Strip) -->
  <header id="main-header" class="site-header"></header>

  <main class="main-content">
    <div class="container">

      <!-- Breadcrumbs -->
      <nav class="breadcrumb-nav" id="catalog-breadcrumb" aria-label="Breadcrumb" style="margin-bottom: 14px;">
        <a href="index.html">Home</a> &gt;
        <span id="breadcrumb-category-title" style="color: var(--text-main); font-weight: 600;">Product Catalog</span>
      </nav>

      <!-- Main Marketplace Listing Layout -->
      <div class="catalog-layout" id="catalog-listing-section">
        
        <!-- Left Sidebar: Filters -->
        <aside class="filters-sidebar" id="filters-sidebar" aria-label="Product Filters">
          <div class="filters-header">
            <span class="filters-title">Filters</span>
            <button class="filters-clear-btn" id="clear-filters-btn">CLEAR ALL</button>
            <button id="close-mobile-filters" class="filters-clear-btn" style="display: none;">✕</button>
          </div>

          <!-- Category Filter Group -->
          <div class="filter-group-section">
            <h4 class="filter-group-title">Category</h4>
            <label class="filter-option">
              <input type="checkbox" class="filter-category-checkbox" value="Electronics">
              <span>Electronics</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" class="filter-category-checkbox" value="Fashion">
              <span>Fashion</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" class="filter-category-checkbox" value="Home">
              <span>Home & Kitchen</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" class="filter-category-checkbox" value="Sports">
              <span>Sports & Fitness</span>
            </label>
          </div>

          <!-- Price Range Filter Group -->
          <div class="filter-group-section">
            <h4 class="filter-group-title">Price (₹)</h4>
            <div class="price-inputs-row">
              <input type="number" id="filter-min-price" class="price-input" placeholder="Min" min="0">
              <span style="color: var(--text-muted); font-size: 11px;">to</span>
              <input type="number" id="filter-max-price" class="price-input" placeholder="Max" min="0">
              <button id="price-filter-apply-btn" class="price-apply-btn">Go</button>
            </div>
          </div>

          <!-- Customer Rating Filter Group -->
          <div class="filter-group-section">
            <h4 class="filter-group-title">Customer Ratings</h4>
            <label class="filter-option">
              <input type="radio" name="filter-rating" value="4">
              <span>4★ & above</span>
            </label>
            <label class="filter-option">
              <input type="radio" name="filter-rating" value="3">
              <span>3★ & above</span>
            </label>
          </div>

          <!-- Availability Filter Group -->
          <div class="filter-group-section">
            <h4 class="filter-group-title">Availability</h4>
            <label class="filter-option">
              <input type="checkbox" id="filter-instock-only">
              <span>Include In-Stock Only</span>
            </label>
          </div>
        </aside>

        <!-- Right Content: Listing Cards & Sort Bar -->
        <section class="catalog-content-panel">
          <div class="catalog-top-bar">
            <div id="results-count-display" class="results-count-text">
              Loading products...
            </div>

            <!-- Mobile Filter Trigger -->
            <button class="mobile-filter-trigger" id="open-mobile-filters" aria-label="Open Filters">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              <span>Filters</span>
            </button>

            <!-- Sort By Dropdown -->
            <div class="sort-container">
              <label for="catalog-sort-select" class="sort-label">Sort By:</label>
              <select id="catalog-sort-select" class="sort-select" aria-label="Sort Catalog">
                <option value="relevance">Relevance</option>
                <option value="price-low-high">Price: Low to High</option>
                <option value="price-high-low">Price: High to Low</option>
                <option value="rating">Customer Rating</option>
                <option value="newest">Newest Arrivals</option>
                <option value="discount">Highest Discount</option>
                <option value="reviewCount">Best Sellers</option>
              </select>
            </div>
          </div>

          <!-- Product Grid -->
          <div class="products-grid" id="products-grid" aria-label="Product Catalog">
            <!-- Rendered by js/products.js -->
          </div>

          <!-- Pagination Bar -->
          <div class="pagination-container" id="pagination-container">
            <!-- Rendered by js/products.js -->
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- Global Marketplace Footer -->
  <footer id="main-footer" class="site-footer"></footer>

  <!-- Scripts -->
  <script src="js/common.js?v=2.0"></script>
  <script src="js/products.js?v=2.0"></script>
</body>
</html>
