<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ApexStore</title>
  <meta name="description" content="Create a new account at ApexStore to shop our curated catalog, save shipping addresses, and track orders.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%232874f0%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%229%22 cy=%2221%22 r=%221%22/><circle cx=%2220%22 cy=%2221%22 r=%221%22/><path d=%22M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6%22/></svg>">
</head>
<body>
  <!-- Global Sticky Header -->
  <header id="main-header" class="site-header"></header>

  <main class="main-content">
    <div class="container">
      <div class="auth-split-wrapper">
        <!-- Blue Left Panel -->
        <div class="auth-blue-panel">
          <div>
            <h1 class="auth-blue-title">Looks like you're new here!</h1>
            <p class="auth-blue-desc">
              Sign up with your email to start shopping on India's premier online marketplace.
            </p>
          </div>
          <div style="font-size: 11px; opacity: 0.85;">
            By signing up, you agree to ApexStore's Terms of Use
          </div>
        </div>

        <!-- Form Right Panel -->
        <div class="auth-form-panel">
          <div id="register-error-banner" style="display: none; background: #ffebee; color: #d32f2f; padding: 10px 14px; font-size: 12px; font-weight: 600; border-radius: 4px; margin-bottom: 14px;"></div>

          <form id="register-form" novalidate>
            <div class="form-field-group">
              <label for="register-name" class="form-label">Full Name *</label>
              <input 
                type="text" 
                id="register-name" 
                class="form-input" 
                placeholder="e.g. Ramesh Kumar" 
                autocomplete="name" 
                required 
              />
            </div>

            <div class="form-field-group">
              <label for="register-email" class="form-label">Email Address *</label>
              <input 
                type="email" 
                id="register-email" 
                class="form-input" 
                placeholder="name@example.com" 
                autocomplete="email" 
                required 
              />
            </div>

            <div class="form-field-group">
              <label for="register-password" class="form-label">Set Password *</label>
              <div class="password-input-wrap">
                <input 
                  type="password" 
                  id="register-password" 
                  class="form-input" 
                  placeholder="Minimum 6 characters" 
                  autocomplete="new-password" 
                  required 
                />
                <button type="button" class="password-toggle-btn" data-target="register-password" aria-label="Toggle password visibility"></button>
              </div>
            </div>

            <button type="submit" id="register-submit-btn" class="btn-buy-now" style="width: 100%; margin-top: 14px; font-size: 14px; padding: 12px;">
              CONTINUE
            </button>
          </form>

          <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-secondary);">
            Existing Customer? <a href="login.html" style="color: var(--primary); font-weight: 700;">Log in</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <footer id="main-footer" class="site-footer"></footer>

  <!-- Scripts -->
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
